# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The client is deployed separately on Vercel, and the database is on Neon.
services:
  - type: web
    name: fika-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run db:deploy -w server && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      # Entered in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Card payments (Stripe test mode): the secret key, the webhook's signing secret,
      # and the shop's address for Stripe to send customers back to (https://bageti.vercel.app)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      # The public demo login shown in the README (staff role: orders and sold-out only)
      - key: DEMO_EMAIL
        value: demo@example.com
      - key: DEMO_PASSWORD
        value: fika-demo
      # Signs login cookies; Render generates a random value
      - key: JWT_SECRET
        generateValue: true
